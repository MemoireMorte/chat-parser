# Local build from source: docker compose -f docker-compose.dev.yml up --build
# Values are read from .env (never committed).
services:
  chat-parser:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      PUBLIC_TWITCH_CLIENT_ID: ${PUBLIC_TWITCH_CLIENT_ID}
      PUBLIC_TWITCH_REDIRECT_URI: ${PUBLIC_TWITCH_REDIRECT_URI:-http://localhost:3000}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    restart: unless-stopped
